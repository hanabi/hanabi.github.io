# See: https://autofix.ci/

name: autofix.ci # This cannot be renamed or else the action will fail.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/setup
      - run: npm run format
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # "@v1" does not work.
        with:
          commit-message: "chore: format with ESLint & Prettier"
